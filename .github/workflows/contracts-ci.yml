name: Contracts CI
on:
  push:
    paths: ["contracts/**"]
  pull_request:
    paths: ["contracts/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vvv
      - run: FOUNDRY_FUZZ_RUNS=10000 forge test --match-contract "Fuzz" -vv
      - run: forge coverage --report summary
