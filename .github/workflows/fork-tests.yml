name: Fork Tests (Coston2)
on:
  push:
    branches: [main]
jobs:
  fork-test:
    runs-on: ubuntu-latest
    env:
      COSTON2_RPC: ${{ secrets.COSTON2_RPC }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: |
          forge test --match-path "test/fork/*" \
            --fork-url ${COSTON2_RPC:-https://coston2-api.flare.network/ext/C/rpc} \
            -vvv
        working-directory: contracts
