name: Fork Tests (Coston2)
on:
  push:
    branches: [main]
jobs:
  fork-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Foundry dependencies
        run: |
          mkdir -p lib
          rm -rf lib/openzeppelin-contracts lib/forge-std
          git clone --depth 1 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Run Coston2 Fork Tests
        run: |
          forge test --match-path "test/fork/*" \
            --fork-url https://coston2-api.flare.network/ext/C/rpc \
            -vvv
